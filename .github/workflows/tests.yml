name: Shop regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Test pack to run
        type: choice
        options: [full, smoke]
        default: full
  schedule:
    - cron: '0 7 * * *'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Full regression pack
        if: github.event_name != 'schedule' && inputs.suite != 'smoke'
        run: python -m pytest
      - name: Daily smoke pack
        if: github.event_name == 'schedule' || inputs.suite == 'smoke'
        run: python scripts/smoke_check.py
      - name: Upload reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            reports/
            test-results/
          retention-days: 14
